[project]
name = "telegram-stream"
version = "0.1.1"
description = "Recoverable, continuous RTMP publishing to Telegram Live Stories."
readme = "README.md"
authors = [
    { name = "Reinier Hernández", email = "sasuke.reinier@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "telethon==1.45.0",
    "yt-dlp[default,deno]==2026.10.26",
]
keywords = ["telegram", "stories", "streaming", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.scripts]
telegram-stream = "telegram_stream.cli:main"

[dependency-groups]
browser = [
    "websockets>=15,<18",
]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "ty>=0.0.1",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
