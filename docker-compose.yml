services:
  streamer:
    build:
      context: .
      target: runtime
    image: telegram-stream:local
    init: true
    restart: unless-stopped
    cpus: ${STREAMER_CPU_LIMIT:-2.0}
    mem_limit: ${STREAMER_MEMORY_LIMIT:-2g}
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - telegram-state:/data
      - ./media:/media:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "telegram-stream", "healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  web:
    profiles: ["web"]
    build:
      context: .
      target: web
    image: telegram-stream:web
    init: true
    restart: unless-stopped
    cpus: ${WEB_CPU_LIMIT:-2.0}
    mem_limit: ${WEB_MEMORY_LIMIT:-2g}
    # Deliberately do not pass .env, Telegram credentials, or session volumes.
    environment:
      PAGE_URL: ${WEB_PAGE_URL:-${SOURCE}}
      WEB_WIDTH: ${VIDEO_WIDTH:-1280}
      WEB_HEIGHT: ${VIDEO_HEIGHT:-720}
      WEB_FPS: ${VIDEO_FPS:-30}
      WEB_CAPTURE_FPS: ${WEB_CAPTURE_FPS:-${VIDEO_FPS:-30}}
      WEB_CAPTURE_SCALE: ${WEB_CAPTURE_SCALE:-2}
      WEB_QUEUE_SIZE: ${WEB_QUEUE_SIZE:-16}
      WEB_VIDEO_BITRATE: ${VIDEO_BITRATE:-2500k}
      WEB_READY_TIMEOUT: ${SOURCE_TIMEOUT:-60}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
    shm_size: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  telegram-state:
